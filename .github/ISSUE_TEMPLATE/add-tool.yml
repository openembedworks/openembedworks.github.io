name: "Request New Tool"
description: Submit a new client-side tool for the OpenEmbedWorks catalog.
title: "[Tool Request] "
labels: ["tool-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Fill out every field below as accurately as possible.
        Your submission is automatically validated (rules + AI review), then a PR is opened
        for a maintainer to approve and merge. Please only submit tools you have tested.

        The fields below map directly onto a new entry in `tools-data.js` (the catalog
        data file). For reference, this is the shape your submission will produce:

        ```json
        {
          "id": "auto-generated-from-tool-name",
          "name": "Tool Name",
          "category": "one-of-the-existing-category-ids",
          "tags": ["existing-tag-id", "existing-tag-id"],
          "description": "Short Description (<= 220 chars, plain text)",
          "url": "https://your-tool-url/",
          "githubRepo": "owner/repo",
          "rating": { "value": 0, "count": 0, "source": "community" }
        }
        ```

        - `id` is auto-generated by slugifying the tool name — you don't need to provide it.
        - `category` must match one of the existing category labels (see dropdown below).
        - `tags` must match existing tag ids already defined in `tools-data.js` — ask a
          maintainer to add a new tag first if yours isn't listed.
        - `rating` starts at zero and accrues organically; you don't need to provide it.

  - type: input
    id: tool-name
    attributes:
      label: Tool Name
      placeholder: "e.g. Hex Lens"
    validations:
      required: true

  - type: textarea
    id: tool-description
    attributes:
      label: Short Description
      description: One or two sentences, 220 characters max. Plain text only (no HTML/markdown).
      placeholder: "Browser-native hex editor to inspect, compare, edit, and save modified binaries."
    validations:
      required: true

  - type: input
    id: tool-url
    attributes:
      label: Tool URL
      description: Must be a working https:// URL where the tool is hosted.
      placeholder: "https://openembedworks.github.io/yourtool/"
    validations:
      required: true

  - type: input
    id: github-repo
    attributes:
      label: GitHub Repository (optional)
      description: "Format: owner/repo"
      placeholder: "openembedworks/yourtool"
    validations:
      required: false

  - type: input
    id: logo-url
    attributes:
      label: Logo URL (optional)
      description: "Direct https:// URL to a logo image (PNG/SVG, ideally square, 64×64 px or larger). Leave blank to use the GitHub account avatar."
      placeholder: "https://example.com/mylogo.png"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the closest match. Categories are defined in tools-data.js.
      options:
        - System & Runtime
        - Networking & Protocols
        - Security
        - Build & Binary Tools
        - AI/ ML
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (optional)
      description: >-
        Comma-separated. Must match existing catalog tags (see tags[] in tools-data.js).
        New tags require a maintainer to add them first.
      placeholder: "binary-analysis, linux"
    validations:
      required: false

  - type: checkboxes
    id: client-side-confirmation
    attributes:
      label: Client-Side Only
      options:
        - label: "This tool runs entirely in the browser with no backend server, and collects no user data."
          required: true

  - type: checkboxes
    id: security-checklist
    attributes:
      label: Security Checklist
      options:
        - label: "The tool does not use eval(), innerHTML with untrusted input, or other unsafe DOM sinks."
          required: true
        - label: "The tool includes no third-party analytics, tracking, or advertising scripts."
          required: true
        - label: "The tool's source code is publicly available and reviewable (e.g. on GitHub)."
          required: true
        - label: "I have tested the tool and confirm the URL above is live and functional."
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        By submitting, you confirm this tool is safe, free to use, and does not violate
        GitHub's Acceptable Use Policies.
